services:
  - type: web
    name: domestic-services-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: domestic-services-api
      - key: JWT_AUDIENCE
        value: domestic-services-client
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: CALL_IP_HMAC_SECRET
        generateValue: true
      - key: CALL_CLICK_DEDUP_WINDOW_SECONDS
        value: "300"
      - key: CLOUD_STORAGE_BUCKET
        sync: false
      - key: CLOUD_STORAGE_REGION
        sync: false
      - key: CLOUD_STORAGE_ENDPOINT
        sync: false
      - key: CLOUD_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: CLOUD_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: ID_DOCUMENT_MAX_BYTES
        value: "10485760"
      - key: ID_DOCUMENT_SIGNED_URL_TTL_SECONDS
        value: "120"
      - key: MEDIA_HOST_ALLOWLIST
        value: res.cloudinary.com,images.unsplash.com
